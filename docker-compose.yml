services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bolivar_opportunities
      POSTGRES_USER: bolivar
      POSTGRES_PASSWORD: bolivar_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bolivar -d bolivar_opportunities"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
volumes:
  postgres_data:
  redis_data:
